[pytest]
pythonpath = .
testpaths = tests
addopts = -q
markers =
    integration: hits real network / GitHub / Firestore emulator / MI250 hardware (skipped by default)
    m0: Foundation & data plane
    m0_6: Storage — Firestore KB backend
    m1: Intelligence plane (inner loop)
    m2: Outer loop — grading + candidate discovery
    m3: Contribution plane — MI250 verification oracle
    m4: Orchestration / always-on
    m5: Dashboard
