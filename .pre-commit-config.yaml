# Pre-commit hooks for vllm-forager.
#   one-time setup:   pre-commit install
#   run on all files: pre-commit run --all-files
#
# black/ruff/mypy run as `local` hooks so they use the exact versions installed in your
# .venv (no separate pinned copies). Activate the venv first: `source .venv/bin/activate`.
repos:
  - repo: local
    hooks:
      - id: black
        name: black (format)
        entry: black
        language: system
        types: [python]
      - id: ruff
        name: ruff (lint + import sort)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (static types)
        entry: mypy
        language: system
        types: [python]
        exclude: ^tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
