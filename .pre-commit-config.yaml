# Pre-commit hooks for vllm-forager.
#   one-time setup:   pre-commit install
#   run on all files: pre-commit run --all-files
#
# black/ruff/mypy run as `local` hooks so they use the exact versions installed in your
# .venv (no separate pinned copies). Activate the venv first: `source .venv/bin/activate`.
repos:
  - repo: local
    hooks:
      - id: black
        name: black (format)
        entry: black
        language: system
        types: [python]
      - id: ruff
        name: ruff (lint + import sort)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (static types)
        # --cache-dir=/dev/null: mypy 2.1.0's SQLite cache metastore intermittently dies
        # with "sqlite3.OperationalError: database is locked" (INTERNAL ERROR, exit 2)
        # *after* reporting "no issues found" — reliably on CI's fresh checkout, flakily
        # locally. --no-incremental doesn't help (the metastore is still opened); writing
        # the cache to /dev/null skips it entirely, so there's no DB to lock. Verified
        # deterministic: 0 crashes in 20 cold runs (vs ~1/3 with --no-incremental).
        entry: mypy --cache-dir=/dev/null
        language: system
        types: [python]
        # docs/research/logs/ holds one-off archived bench scripts from separate MI250
        # experiments, several coincidentally named bench.py -- mypy is given an explicit
        # file list here (not a directory walk), so its own `exclude` config is ignored;
        # excluding at the hook level is what actually works. Without this, two same-named
        # files in different dated log dirs trip mypy's "Duplicate module" error -- flakily,
        # since mypy's collision check depends on file-scan order (passed here, not observed).
        exclude: ^(tests/|docs/research/logs/)
      - id: repos-md-sync
        name: sync docs/PLAN.md tracked-repos block (T3.18)
        # Same auto-fix-then-fail convention as black/ruff above: rewrites the block in place
        # if `config.REPOS` changed since it was last generated, then exits 1 so the change
        # gets re-staged — the doc structurally can't go stale past a commit, not just get
        # caught later by tests/test_repos_md.py.
        entry: python scripts/repos-md.py --sync
        language: system
        pass_filenames: false
        files: ^(src/config\.py|docs/PLAN\.md|scripts/repos-md\.py)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
