name: CI

# Merge gate for pull requests (and a check on main). Green = eligible to merge;
# a human still performs the merge (see docs/DEVPLAN.md "Git & PR workflow").
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint / format / type checks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Tests
        run: pytest
